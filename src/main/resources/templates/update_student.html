<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Sửa sinh viên</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-header bg-warning">
                <h4 class="mb-0">SỬA SINH VIÊN</h4>
            </div>

            <div class="card-body">
                <form th:action="@{/students/{id}(id=${student.id})}" th:object="${student}" method="post">

                    <!-- ID -->
                    <div class="mb-3">
                        <label class="form-label">ID</label>
                        <input type="text" class="form-control" th:field="*{id}" readonly>
                    </div>

                    <!-- Name -->
                    <div class="mb-3">
                        <label class="form-label">Họ tên</label>
                        <input type="text" class="form-control" th:field="*{name}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <!-- Age -->
                    <div class="mb-3">
                        <label class="form-label">Tuổi</label>
                        <input type="number" class="form-control" th:field="*{age}" min="0" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" th:field="*{email}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-primary">
                            Cập nhật
                        </button>
                        <a href="/students" class="btn btn-secondary">
                            Hủy
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>

</body>

</html>
