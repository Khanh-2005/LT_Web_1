<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Students Management</title>

    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6/dist/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="hold-transition sidebar-mini">
<div class="wrapper">

    <div class="content-wrapper p-3">
        <section class="content">

            <div class="container-fluid">
                <h3>Danh sách sinh viên</h3>

                <button class="btn btn-primary mb-3" onclick="openAddModal()">
                    <i class="fa fa-plus"></i> Thêm sinh viên
                </button>

                <table class="table table-bordered table-hover">
                    <thead class="thead-dark">
                    <tr>
                        <th>Code</th>
                        <th>Họ tên</th>
                        <th>Giới tính</th>
                        <th>Ngày sinh</th>
                        <th>Địa chỉ</th>
                        <th>Trạng thái</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody id="studentTable"></tbody>
                </table>
            </div>

        </section>
    </div>

</div>

<!-- Modal -->
<div class="modal fade" id="studentModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 id="modalTitle">Thêm sinh viên</h5>
                <button class="close" data-dismiss="modal">&times;</button>
            </div>

            <div class="modal-body">
                <input type="hidden" id="studentId">

                <div class="form-group">
                    <label>Code</label>
                    <input id="code" class="form-control">
                </div>

                <div class="form-group">
                    <label>Fullname</label>
                    <input id="fullname" class="form-control">
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender" class="form-control">
                        <option>Nam</option>
                        <option>Nữ</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <input id="address" class="form-control">
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-success" onclick="saveStudent()">Save</button>
                <button class="btn btn-secondary" data-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API_URL = "http://localhost:8080/api/students";

    // Load data
    async function loadStudents() {
        const res = await fetch(API_URL);
        const data = await res.json();

        let html = "";
        data.forEach(s => {
            html += `
                <tr>
                    <td>${s.code}</td>
                    <td>${s.fullname}</td>
                    <td>${s.gender}</td>
                    <td>${formatDate(s.date_of_birth)}</td>
                    <td>${s.address}</td>
                    <td>${s.status}</td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick='editStudent(${JSON.stringify(s)})'>
                            <i class="fa fa-edit"></i>
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="deleteStudent('${s.id}')">
                            <i class="fa fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
        });

        document.getElementById("studentTable").innerHTML = html;
    }

    function formatDate(date) {
        return date ? new Date(date).toLocaleDateString() : "";
    }

    // Add
    function openAddModal() {
        document.getElementById("modalTitle").innerText = "Thêm sinh viên";
        document.getElementById("studentId").value = "";
        $("#studentModal").modal("show");
    }

    // Edit
    function editStudent(s) {
        document.getElementById("modalTitle").innerText = "Sửa sinh viên";
        document.getElementById("studentId").value = s.id;
        document.getElementById("code").value = s.code;
        document.getElementById("fullname").value = s.fullname;
        document.getElementById("gender").value = s.gender;
        document.getElementById("address").value = s.address;

        $("#studentModal").modal("show");
    }

    // Save (Add + Update)
    async function saveStudent() {
        const id = document.getElementById("studentId").value;

        const student = {
            code: document.getElementById("code").value,
            fullname: document.getElementById("fullname").value,
            gender: document.getElementById("gender").value,
            address: document.getElementById("address").value
        };

        if (id) {
            // UPDATE
            await fetch(API_URL + "/" + id, {
                method: "PUT",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(student)
            });
        } else {
            // CREATE
            await fetch(API_URL, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(student)
            });
        }

        $("#studentModal").modal("hide");
        loadStudents();
    }

    // Delete
    async function deleteStudent(id) {
        if (!confirm("Bạn có chắc muốn xóa?")) return;

        await fetch(API_URL + "/" + id, {
            method: "DELETE"
        });

        loadStudents();
    }

    // Init
    loadStudents();
</script>

</body>
</html>
