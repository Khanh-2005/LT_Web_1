<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Chi tiết sinh viên</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <!-- Title -->
        <div class="mb-4">
            <h3 class="fw-bold">👤 Chi tiết sinh viên</h3>
        </div>

        <!-- Student Detail Card -->
        <div class="card shadow-sm">
            <div class="card-body">

                <table class="table table-bordered align-middle">
                    <tbody>
                        <tr>
                            <th class="w-25 bg-light">ID</th>
                            <td th:text="${student.id}"></td>
                        </tr>
                        <tr>
                            <th class="bg-light">Họ tên</th>
                            <td th:text="${student.name}"></td>
                        </tr>
                        <tr>
                            <th class="bg-light">Tuổi</th>
                            <td th:text="${student.age}"></td>
                        </tr>
                        <tr>
                            <th class="bg-light">Email</th>
                            <td th:text="${student.email}"></td>
                        </tr>
                    </tbody>
                </table>

                <!-- Actions -->
                <div class="d-flex justify-content-between mt-4">
                    <a class="btn btn-secondary" th:href="@{/students}">
                        ⬅ Quay lại danh sách
                    </a>

                    <div class="d-flex gap-2">
                        <a class="btn btn-warning" th:href="@{'/students/' + ${student.id} + '/edit'}">
                            ✏ Sửa
                        </a>

                        <form th:action="@{'/students/' + ${student.id} + '/delete'}" method="post"
                            th:onsubmit="return confirm('Bạn có chắc chắn muốn xóa sinh viên này không?');">
                            <button type="submit" class="btn btn-danger">
                                🗑 Xóa
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
